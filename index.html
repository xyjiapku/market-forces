<!DOCTYPE html>
<html lang="en" data-fs="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARKET FORCES — A Firm's Journey</title>
<style>
:root{
  --bg:#EEF2F9; --bg2:#F7F9FD; --surface:#FFFFFF; --surface2:#F6F9FD;
  --ink:#0E1B2C; --ink2:#2F4360; --muted:#6B7C96; --faint:#93A2B8;
  --line:#E1E7F1; --line2:#C9D4E4;
  --brand:#1CADE4; --brand-d:#0B7FAE;
  --good:#0E9F6E; --goodbg:#E8F7F0; --bad:#DA3A3F; --badbg:#FCEDEE;
  --warn:#C2721A; --warnbg:#FDF3E3; --gold:#E8A317;
  --r:16px; --r2:12px;
  --sh:0 1px 2px rgba(14,27,44,.05), 0 10px 26px rgba(14,27,44,.07);
  --sh2:0 2px 6px rgba(14,27,44,.06), 0 18px 44px rgba(14,27,44,.11);
}
html{font-size:19px}
html[data-fs="s"]{font-size:16.5px}
html[data-fs="l"]{font-size:21.5px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 12% -10%, #FFFFFF 0%, rgba(255,255,255,0) 60%),
    radial-gradient(900px 500px at 100% 0%, #E5EEFA 0%, rgba(255,255,255,0) 55%),
    var(--bg);
  color:var(--ink);
  font:1rem/1.5 "Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Microsoft YaHei",sans-serif;
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 90% at 50% 40%, rgba(255,255,255,0) 55%, rgba(14,27,44,.05) 100%)}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:1rem 1.1rem 4rem}

/* ---------------- top bar ---------------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:.7rem;padding:.5rem 1.1rem;flex-wrap:wrap}
.topbar .tb-firm{display:flex;align-items:center;gap:.5rem;font-weight:700}
.tb-firm .chip{width:2rem;height:2rem;border-radius:9px;display:grid;place-items:center;
  font-size:1.05rem;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.tb-name{max-width:15ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-stats{margin-left:auto;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  padding:.22rem .55rem;display:flex;flex-direction:column;line-height:1.15;min-width:5.2rem}
.stat b{font-size:.95rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.stat.pos b{color:var(--good)} .stat.neg b{color:var(--bad)}
.fsgroup{display:flex;gap:.2rem;align-items:center}
.fsbtn{border:1px solid var(--line);background:#fff;border-radius:8px;width:1.6rem;height:1.6rem;
  cursor:pointer;font-size:.72rem;font-weight:800;color:var(--muted);line-height:1}
.fsbtn:hover{border-color:var(--line2);color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:.28rem .6rem;
  cursor:pointer;font-size:.8rem;font-weight:700;color:var(--ink2)}
.iconbtn:hover{border-color:var(--brand);color:var(--brand-d)}

/* ---------------- cards & type ---------------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:1.15rem 1.25rem;margin-bottom:1rem}
.card.tight{padding:.85rem 1rem}
.kicker{font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-d)}
h1{font-size:2rem;line-height:1.15;margin:.15rem 0 .35rem;letter-spacing:-.015em}
h2{font-size:1.42rem;line-height:1.2;margin:.1rem 0 .3rem;letter-spacing:-.01em}
h3{font-size:1.06rem;margin:.9rem 0 .35rem}
.lead{font-size:1.05rem;color:var(--ink2);margin:.3rem 0 .5rem}
.body{font-size:.95rem;color:var(--ink2)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.tiny{font-size:.72rem}
.narr{font-size:.96rem;color:var(--ink2);margin:.45rem 0}
.narr b{color:var(--ink)}
hr.sep{border:none;border-top:1px solid var(--line);margin:.9rem 0}
ul.clean,ol.clean{margin:.4rem 0 .4rem 1.1rem;padding:0}
ul.clean li,ol.clean li{margin:.28rem 0;font-size:.93rem;color:var(--ink2)}

/* ---------------- buttons ---------------- */
.btn{border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:11px;
  padding:.55rem .95rem;font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit;
  transition:transform .08s ease, box-shadow .12s ease, border-color .12s ease}
.btn:hover{border-color:var(--brand);color:var(--brand-d);box-shadow:0 3px 10px rgba(14,27,44,.08)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(28,173,228,.3)}
.btn.primary:hover{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.btn.wide{width:100%;justify-content:center}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btnrow{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center;margin-top:.9rem}
.btnrow.right{justify-content:flex-end}
.btn.big{padding:.7rem 1.3rem;font-size:1rem}

/* ---------------- progress steps ---------------- */
.steps{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap;margin:.2rem 0 .9rem}
.stepdot{display:flex;align-items:center;gap:.35rem;font-size:.68rem;font-weight:800;
  letter-spacing:.04em;text-transform:uppercase;color:var(--faint);
  background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:.2rem .6rem}
.stepdot.on{color:var(--brand-d);border-color:var(--brand);background:#E9F7FE}
.stepdot.done{color:var(--good);border-color:#BFE8D6;background:var(--goodbg)}

/* ---------------- setup ---------------- */
.grid2{display:grid;grid-template-columns:1.25fr .95fr;gap:1rem;align-items:start}
.grid2.rev{grid-template-columns:.95fr 1.25fr}
.prodgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin:.55rem 0 .2rem}
.prod{border:2px solid var(--line);background:#fff;border-radius:13px;padding:.6rem .5rem;cursor:pointer;
  text-align:center;transition:all .13s ease}
.prod:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--sh)}
.prod .em{font-size:1.7rem;line-height:1.1;display:block}
.prod .nm{font-size:.78rem;font-weight:700;margin-top:.2rem;color:var(--ink2)}
.prod .un{font-size:.66rem;color:var(--muted)}
.prod.sel{border-color:var(--brand);background:#F0FAFF;box-shadow:0 6px 18px rgba(28,173,228,.18)}
.prod.sel .nm{color:var(--brand-d)}
.swatches{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0}
.sw{width:2.1rem;height:2.1rem;border-radius:50%;cursor:pointer;border:3px solid #fff;
  box-shadow:0 0 0 1.5px var(--line2);transition:transform .1s ease}
.sw:hover{transform:scale(1.09)}
.sw.sel{box-shadow:0 0 0 3px var(--ink)}
input[type=text]{font:inherit;font-size:.95rem;padding:.5rem .7rem;border-radius:10px;
  border:1.5px solid var(--line2);width:100%;background:#fff;color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(28,173,228,.15)}
.preview{border-radius:14px;padding:1rem;color:#fff;position:relative;overflow:hidden}
.preview:after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(0,0,0,.30))}
.preview .pv-in{position:relative;z-index:2}
.preview .pv-em{font-size:2.6rem;line-height:1}
.preview .pv-nm{font-size:1.15rem;font-weight:800;margin-top:.25rem;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.preview .pv-tag{font-size:.72rem;opacity:.92;letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.tagline{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.9}

/* ---------------- tables ---------------- */
table.dt{width:100%;border-collapse:collapse;font-size:.82rem;font-variant-numeric:tabular-nums}
table.dt th{background:var(--surface2);color:var(--muted);font-size:.68rem;text-transform:uppercase;
  letter-spacing:.05em;font-weight:800;padding:.4rem .4rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.dt th:first-child,table.dt td:first-child{text-align:left}
table.dt td{padding:.34rem .4rem;border-bottom:1px solid #F0F3F9;text-align:right;color:var(--ink2)}
table.dt tr.hl td{background:#FFF9E8;color:var(--ink);font-weight:800}
table.dt tr.pick td{background:#E9F7FE;color:var(--brand-d);font-weight:800}
table.dt td.bad{color:var(--bad)} table.dt td.good{color:var(--good)}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:var(--r2);max-height:23rem}

table.mx{width:100%;border-collapse:separate;border-spacing:.3rem;font-size:.9rem}
table.mx th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;padding:.3rem}
table.mx td{border:1.5px solid var(--line);border-radius:11px;padding:.55rem .4rem;text-align:center;
  background:var(--surface2);font-variant-numeric:tabular-nums}
table.mx td small{display:block;font-size:.68rem;color:var(--muted);font-weight:700}
table.mx td.you{background:#E9F7FE;border-color:var(--brand)}
table.mx td.you b{color:var(--brand-d)}
table.mx td b{font-size:1.05rem}
table.mx td.taken{box-shadow:inset 0 0 0 3px rgba(232,163,23,.55);background:#FFF9E8}

/* ---------------- metric tiles ---------------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.4rem,1fr));gap:.45rem;margin:.6rem 0}
.tile{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r2);padding:.45rem .5rem}
.tile .tl{font-size:.63rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.tile .tv{font-size:1.16rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .ts{font-size:.66rem;color:var(--faint)}
.tile.pos .tv{color:var(--good)} .tile.neg .tv{color:var(--bad)}
.tile.hi{background:#F0FAFF;border-color:#BCE6F8}
.tile.hi .tv{color:var(--brand-d)}
.tile.warn{background:var(--warnbg);border-color:#F0DDB8}

/* ---------------- controls ---------------- */
.ctl{margin:.85rem 0}
.ctl .clab{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.3rem}
.ctl .clab .t{font-size:.85rem;font-weight:800;color:var(--ink)}
.ctl .clab .v{font-size:1.15rem;font-weight:800;color:var(--brand-d);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:1.35rem;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:.5rem;border-radius:99px;background:linear-gradient(90deg,#D5E6F5,#C9D4E4)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.45rem;height:1.45rem;border-radius:50%;
  background:var(--brand);border:3px solid #fff;box-shadow:0 1px 6px rgba(14,27,44,.35);margin-top:-.48rem}
input[type=range]::-moz-range-track{height:.5rem;border-radius:99px;background:#D5E6F5}
input[type=range]::-moz-range-thumb{width:1.35rem;height:1.35rem;border-radius:50%;background:var(--brand);
  border:3px solid #fff;box-shadow:0 1px 6px rgba(14,27,44,.35)}
.ticks{display:flex;justify-content:space-between;font-size:.66rem;color:var(--faint);font-weight:700;margin-top:.05rem}
.optrow{display:flex;gap:.5rem;flex-wrap:wrap;margin:.4rem 0}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:.5rem .8rem;cursor:pointer;
  font-weight:700;font-size:.85rem;color:var(--ink2);transition:all .12s ease;text-align:left}
.opt:hover{border-color:var(--line2)}
.opt.sel{border-color:var(--brand);background:#F0FAFF;color:var(--brand-d)}
.opt small{display:block;font-weight:600;font-size:.66rem;color:var(--muted)}
.opt.sel small{color:var(--brand-d)}

/* ---------------- check / quiz ---------------- */
.checkopt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;
  border-radius:12px;padding:.6rem .8rem;margin:.4rem 0;cursor:pointer;font-size:.9rem;font-weight:600;
  color:var(--ink2);font-family:inherit;transition:all .12s ease}
.checkopt:hover{border-color:var(--brand);color:var(--ink)}
.checkopt.ok{border-color:var(--good);background:var(--goodbg);color:#0A6B4A}
.checkopt.no{border-color:var(--bad);background:var(--badbg);color:#9B2226}
.fb{margin-top:.6rem;padding:.65rem .8rem;border-radius:var(--r2);font-size:.87rem;display:none}
.fb.show{display:block}
.fb.ok{background:var(--goodbg);border-left:4px solid var(--good);color:#0A5C40}
.fb.no{background:var(--badbg);border-left:4px solid var(--bad);color:#8E2124}

/* ---------------- event / narrative ---------------- */
.event{border-left:5px solid var(--brand);background:linear-gradient(100deg,#F4FBFF,#FFFFFF 40%)}
.event.warn{border-left-color:var(--warn);background:linear-gradient(100deg,#FEF7EA,#FFFFFF 40%)}
.event.bad{border-left-color:var(--bad);background:linear-gradient(100deg,#FDF0F0,#FFFFFF 40%)}
.event.good{border-left-color:var(--good);background:linear-gradient(100deg,#EEFAF4,#FFFFFF 40%)}
.evt-tag{display:inline-block;font-size:.64rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;
  padding:.16rem .5rem;border-radius:99px;background:var(--ink);color:#fff}
.evt-tag.warn{background:var(--warn)} .evt-tag.bad{background:var(--bad)} .evt-tag.good{background:var(--good)}
.pricetag{display:inline-flex;align-items:baseline;gap:.35rem;background:var(--ink);color:#fff;
  border-radius:12px;padding:.3rem .7rem;font-weight:800}
.pricetag .old{font-size:.8rem;opacity:.6;text-decoration:line-through}
.pricetag .new{font-size:1.25rem}
.delta{font-weight:800;font-size:.85rem}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}

/* ---------------- chart ---------------- */
.chartcard{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r2);padding:.5rem .35rem .2rem;margin:.7rem 0}
.labctl{position:sticky;top:3.4rem;z-index:20;box-shadow:var(--sh2);margin-bottom:.9rem}
.chartcard svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:.75rem;flex-wrap:wrap;font-size:.72rem;color:var(--ink2);font-weight:700;
  padding:.15rem .6rem .45rem}
.legend i{display:inline-block;width:.85rem;height:.2rem;border-radius:2px;margin-right:.3rem;vertical-align:middle}
.legend i.dot{width:.5rem;height:.5rem;border-radius:50%}
svg text{font-family:inherit}
.ct{fill:var(--faint);font-size:.68rem}
.cl{fill:var(--ink2);font-size:.76rem;font-weight:800}
.cn{fill:var(--ink);font-size:.78rem;font-weight:800}
.ca{fill:var(--muted);font-size:.74rem;font-weight:800;letter-spacing:.03em}
.cw{fill:#fff;font-size:.75rem;font-weight:900}
.ax{stroke:var(--line2);stroke-width:1.4;fill:none}
.gr{stroke:#DDE5F0;stroke-width:1;stroke-dasharray:2 4}
.bar-axis{stroke:var(--ink2);stroke-width:1.6}
rect.zone-good{fill:#0E9F6E;opacity:.13}
rect.zone-bad{fill:#DA3A3F;opacity:.13}
polygon.dwl{fill:#DA3A3F;opacity:.2;stroke:#DA3A3F;stroke-width:1.2}
.line-profit{stroke:#E8A317;stroke-width:1.4;stroke-dasharray:4 3}

/* ---------------- misc ---------------- */
.pill{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:.2rem .55rem;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.pill.b{background:#E9F7FE;border-color:#BCE6F8;color:var(--brand-d)}
.pill.g{background:var(--goodbg);border-color:#BFE8D6;color:#0A6B4A}
.pill.w{background:var(--warnbg);border-color:#F0DDB8;color:#8A5210}
.pill.r{background:var(--badbg);border-color:#F6CFD1;color:#9B2226}
.shoprow{display:flex;gap:.45rem;flex-wrap:wrap;align-items:flex-end}
.shop{border-radius:11px;padding:.4rem .55rem;text-align:center;font-size:.62rem;font-weight:800;color:#fff;
  min-width:4.2rem;box-shadow:var(--sh);position:relative;transition:all .3s ease}
.shop.closed{filter:grayscale(1);opacity:.32}
.shop .e{font-size:1.15rem;display:block}
.shop.mine{box-shadow:0 0 0 3px var(--gold),var(--sh)}
.scoreline{display:flex;justify-content:space-between;gap:.6rem;padding:.45rem .1rem;border-bottom:1px dashed var(--line);font-size:.88rem}
.scoreline b{font-variant-numeric:tabular-nums}
.bigscore{font-size:2.4rem;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.rankcard{border-radius:var(--r);padding:1.1rem;color:#fff;background:linear-gradient(135deg,var(--brand),#0B6E9E)}
.rankcard h2{color:#fff;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(220%);bottom:1.2rem;z-index:80;
  background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:12px;font-weight:700;font-size:.88rem;
  box-shadow:var(--sh2);transition:transform .3s cubic-bezier(.2,.9,.3,1.2),opacity .25s ease,visibility .25s;
  opacity:0;visibility:hidden;pointer-events:none;max-width:80vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
.optgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.5rem 0 .2rem}
.modal{position:fixed;inset:0;z-index:90;background:rgba(14,27,44,.55);display:none;padding:1.2rem}
.modal.show{display:block}
.sheet{background:#fff;max-width:900px;margin:0 auto;border-radius:var(--r);box-shadow:var(--sh2);
  max-height:calc(100vh - 2.4rem);overflow:auto;padding:1.4rem 1.6rem}
.sheet h2{margin-top:0}
.sheet .close{position:sticky;top:0;float:right;z-index:2}
.tag{font-size:.68rem;font-weight:800;padding:.12rem .45rem;border-radius:6px;background:var(--surface2);
  border:1px solid var(--line);color:var(--muted);margin-right:.3rem;white-space:nowrap;display:inline-block}
.q{border-left:3px solid var(--brand);padding-left:.75rem;margin:.85rem 0}
.q .qn{font-weight:800;color:var(--ink)}
.q .ans{font-size:.84rem;color:var(--muted);margin-top:.25rem}
.q .ans b{color:var(--ink2)}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.spark{animation:spark 1.1s ease both}
@keyframes spark{0%{box-shadow:0 0 0 0 rgba(232,163,23,.5)}100%{box-shadow:0 0 0 18px rgba(232,163,23,0)}}
@media (max-width:880px){
  .grid2,.grid2.rev{grid-template-columns:1fr}
  .prodgrid{grid-template-columns:repeat(2,1fr)}
  .optgrid3{grid-template-columns:1fr}
  h1{font-size:1.6rem}
}
@media print{
  .topbar,.btnrow,.no-print{display:none !important}
  body{background:#fff}
  .modal{position:static;background:#fff;padding:0;display:block}
  .sheet{max-height:none;box-shadow:none;padding:0}
  .card{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<div class="vignette"></div>
<header class="topbar" id="topbar"></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>

/* ============================================================
   MARKET FORCES — economics engine
   All numbers in this file are validated by scripts/verify.js
   ============================================================ */

const ECON = {
  /* --- technology of the firm (short run, Cobb-Douglas style with
     diminishing returns; output per machine approaches V) --- */
  V: 48,          // asymptotic output per machine per period
  LAND: 200,      // rent for the workshop (fixed factor: LAND) per period
  MACHINE: 150,   // hire/lease cost of one machine (fixed factor: CAPITAL)
  WAGE: 90,       // wage per worker per period (variable factor: LABOUR)
  MAT: 3,         // raw material cost per unit of output (variable factor)

  MAXL: 26,

  /* Q = V*K*L^2 / (16K^2 + L^2)   — scale-neutral in L/K,
     so the shape only depends on workers per machine x = L/K  */
  output(K, L) {
    if (L <= 0) return 0;
    return (ECON.V * K * L * L) / (16 * K * K + L * L);
  },
  mp(K, L) { return L <= 0 ? 0 : ECON.output(K, L) - ECON.output(K, L - 1); },
  ap(K, L) { return L <= 0 ? 0 : ECON.output(K, L) / L; },

  tfc(K) { return ECON.LAND + ECON.MACHINE * K; },
  tvc(K, L) { return ECON.WAGE * L + ECON.MAT * ECON.output(K, L); },
  tc(K, L) { return ECON.tfc(K) + ECON.tvc(K, L); },

  ac(K, L) { const q = ECON.output(K, L); return q > 0 ? ECON.tc(K, L) / q : Infinity; },
  avc(K, L) { const q = ECON.output(K, L); return q > 0 ? ECON.tvc(K, L) / q : Infinity; },
  afc(K, L) { const q = ECON.output(K, L); return q > 0 ? ECON.tfc(K) / q : Infinity; },

  /* marginal cost = extra total cost of the next worker / extra output */
  mc(K, L) {
    if (L <= 0) return Infinity;
    const dq = ECON.output(K, L) - ECON.output(K, L - 1);
    if (dq <= 0.0001) return Infinity;
    return (ECON.tc(K, L) - ECON.tc(K, L - 1)) / dq;
  },

  /* minimum of AVC: AVC = WAGE/AP + MAT, AP max = V/8 at x = 4  */
  minAVC() { return (ECON.WAGE * 8) / ECON.V + ECON.MAT; },

  profit(K, L, P, qSoldOverride) {
    const q = qSoldOverride == null ? ECON.output(K, L) : qSoldOverride;
    return P * q - ECON.tc(K, L);
  },

  /* best labour input for a price taker facing price P */
  bestL(K, P) {
    let bestL = 0, best = -Infinity;
    for (let L = 0; L <= ECON.MAXL; L++) {
      const v = ECON.profit(K, L, P);
      if (v > best + 1e-9) { best = v; bestL = L; }
    }
    return { L: bestL, profit: best };
  },

  /* ---- market demand:  Q = A - B*P  ---------------------------------- */
  A: 300, B: 5,
  marketQ(P) { return Math.max(0, ECON.A - ECON.B * P); },
  marketP(Q) { return Math.max(0, (ECON.A - Q) / ECON.B); },
  mrFromQ(Q) { return (ECON.A - 2 * Q) / ECON.B; },   // MR of a linear demand

  /* labour needed to physically produce q units with K machines */
  labourFor(K, q) {
    if (q <= 0) return 0;
    // solve V*K*L^2/(16K^2+L^2) = q  ->  (V*K - q) L^2 = 16 q K^2
    const a = ECON.V * K - q;
    if (a <= 0) return Infinity;                      // beyond asymptotic capacity
    return Math.sqrt((16 * q * K * K) / a);
  },

  /* profit for a price maker who sets price P, spends ad spend A,
     and owns K machines; demand multiplier comes from the caller */
  priceMaker(K, P, demMult, adFixed) {
    const q = Math.max(0, (ECON.A - ECON.B * P) * (demMult == null ? 1 : demMult));
    const L = ECON.labourFor(K, q);
    const ad = adFixed || 0;
    if (!isFinite(L)) return { q, L: Infinity, ac: Infinity, tc: Infinity, tr: P * q, profit: -Infinity, feasible: false };
    const tc = ECON.tc(K, L) + ad;
    return { q, L, ac: tc / q, tc, tr: P * q, profit: P * q - tc, feasible: true, mr: ECON.mrFromQ(q) };
  }
};

if (typeof module !== 'undefined') module.exports = ECON;

/* ============================================================
   MARKET FORCES — number formatting, SVG chart engine, artwork
   ============================================================ */

/* ---------- numbers: never show float tails ---------- */
function fmt(x, d) { d = d == null ? 1 : d; if (!isFinite(x)) return '—'; return Number(x).toFixed(d); }
function money(x, d) {
  d = d == null ? 0 : d;
  if (!isFinite(x)) return '—';
  const v = Math.abs(x);
  const s = v >= 1000 ? v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }) : v.toFixed(d);
  return (x < 0 ? '-$' : '$') + s;
}
function pct(x, d) { return fmt(x * 100, d == null ? 0 : d) + '%'; }

function niceTicks(min, max, n) {
  const span = max - min;
  if (!(span > 0)) return [min];
  const raw = span / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  let step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10;
  step *= mag;
  const out = [];
  for (let v = Math.ceil(min / step - 1e-9) * step; v <= max + 1e-9; v += step) out.push(Math.round(v / step) * step);
  return out;
}
function tickLabel(v, step) { return Math.abs(step) < 1 ? fmt(v, 1) : String(Math.round(v)); }

/* ============================================================
   map(): generic SVG line chart on a light surface
   cfg = {
     w,h, x:[min,max], y:[min,max], xLabel, yLabel,
     series:[{pts,color,width,dash,label,labelAt,labelDy,hideTail}],
     points:[{x,y,label,color,dy,dx,above}],
     shapes:[{type:'rect'|'poly',...}],
     hlines:[{y,color,dash,label,labelSide,width}],
     vlines:[{x,color,dash,label,labelTop}],
     bands:[{x0,x1,color,opacity}]
   }
   ============================================================ */
function chart(cfg) {
  const W = cfg.w || 680, H = cfg.h || 380;
  const pad = Object.assign({ l: 64, r: 92, t: 28, b: 52 }, cfg.pad || {});
  /* end-of-line labels are drawn just past the last data point: make the right
     gutter wide enough for the longest of them so nothing escapes the viewBox */
  let maxLab = 0;
  (cfg.series || []).forEach(s => {
    if (s.label && !s.labelAt && s.pts && s.pts.length) maxLab = Math.max(maxLab, String(s.label).length);
  });
  if (maxLab) pad.r = Math.max(pad.r, Math.min(210, maxLab * 0.76 * 19 * 0.60 + 18));
  pad.r = Math.min(pad.r, Math.max(70, Math.round(W * 0.30)));
  const x0 = pad.l, x1 = W - pad.r, y0 = H - pad.b, y1 = pad.t;
  const X = v => x0 + (v - cfg.x[0]) / (cfg.x[1] - cfg.x[0]) * (x1 - x0);
  const Y = v => y0 - (v - cfg.y[0]) / (cfg.y[1] - cfg.y[0]) * (y0 - y1);
  const out = [];
  out.push(`<rect x="0" y="0" width="${W}" height="${H}" fill="#FFFFFF"/>`);

  const xt = niceTicks(cfg.x[0], cfg.x[1], cfg.xTicks || 6);
  const yt = niceTicks(cfg.y[0], cfg.y[1], cfg.yTicks || 5);
  const xs = xt.length > 1 ? xt[1] - xt[0] : 1, ys = yt.length > 1 ? yt[1] - yt[0] : 1;

  // grid
  xt.forEach(v => out.push(`<line class="gr" x1="${X(v).toFixed(1)}" y1="${y0}" x2="${X(v).toFixed(1)}" y2="${y1}"/>`));
  yt.forEach(v => out.push(`<line class="gr" x1="${x0}" y1="${Y(v).toFixed(1)}" x2="${x1}" y2="${Y(v).toFixed(1)}"/>`));

  // bands
  (cfg.bands || []).forEach(b => out.push(
    `<rect class="zone-good" x="${X(b.x0).toFixed(1)}" y="${y1}" width="${(X(b.x1) - X(b.x0)).toFixed(1)}" height="${y0 - y1}" fill="${b.color}" opacity="${b.opacity == null ? .16 : b.opacity}"/>`));

  // shapes
  (cfg.shapes || []).forEach(s => {
    if (s.type === 'rect') {
      const xa = Math.min(X(s.x0), X(s.x1)), wa = Math.abs(X(s.x1) - X(s.x0));
      const ya = Math.min(Y(s.y0), Y(s.y1)), ha = Math.abs(Y(s.y1) - Y(s.y0));
      out.push(`<rect x="${xa.toFixed(1)}" y="${ya.toFixed(1)}" width="${wa.toFixed(1)}" height="${ha.toFixed(1)}" fill="${s.fill}" opacity="${s.opacity == null ? .18 : s.opacity}" stroke="${s.stroke || 'none'}" stroke-width="${s.sw || 1.4}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''}/>`);
    } else if (s.type === 'poly') {
      const p = s.pts.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
      out.push(`<polygon points="${p}" fill="${s.fill || 'none'}" opacity="${s.opacity == null ? .2 : s.opacity}" stroke="${s.stroke || 'none'}" stroke-width="${s.sw || 1.4}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''}/>`);
    }
  });

  // hlines
  (cfg.hlines || []).forEach(l => {
    if (l.y < cfg.y[0] || l.y > cfg.y[1]) return;
    out.push(`<line x1="${x0}" y1="${Y(l.y).toFixed(1)}" x2="${x1}" y2="${Y(l.y).toFixed(1)}" stroke="${l.color}" stroke-width="${l.width || 2.2}" ${l.dash ? `stroke-dasharray="${l.dash}"` : ''}/>`);
    if (l.label) {
      const lx = l.labelSide === 'left' ? x0 + 6 : x1 - 6;
      const anch = l.labelSide === 'left' ? 'start' : 'end';
      out.push(`<text class="cl" x="${lx}" y="${(Y(l.y) - 7).toFixed(1)}" text-anchor="${anch}" fill="${l.color}" stroke="#fff" stroke-width="3.2" paint-order="stroke">${l.label}</text>`);
    }
  });

  // vlines
  (cfg.vlines || []).forEach((l, i) => {
    if (l.x < cfg.x[0] || l.x > cfg.x[1]) return;
    out.push(`<line x1="${X(l.x).toFixed(1)}" y1="${y0}" x2="${X(l.x).toFixed(1)}" y2="${y1}" stroke="${l.color}" stroke-width="1.8" stroke-dasharray="5 4"/>`);
    if (l.label) {
      // labels sit just above the x-axis: the top of the plot is where the curve
      // labels live, and stacking there caused collisions
      const nearRight = X(l.x) > (x0 + x1) / 2;
      out.push(`<text class="cl" x="${(X(l.x) + (nearRight ? -7 : 7)).toFixed(1)}" y="${(y0 - 9 - i * 17).toFixed(1)}" text-anchor="${nearRight ? 'end' : 'start'}" fill="${l.color}" stroke="#fff" stroke-width="3.2" paint-order="stroke">${l.label}</text>`);
    }
  });

  // series
  (cfg.series || []).forEach(s => {
    const pts = s.pts.filter(p => p[0] >= cfg.x[0] - 1e-6 && p[0] <= cfg.x[1] + 1e-6 && isFinite(p[1]));
    if (!pts.length) return;
    const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
    out.push(`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2.6}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''}/>`);
    if (s.label) {
      let lx, ly, anch = 'start';
      if (s.labelAt) { lx = X(s.labelAt[0]); ly = Y(s.labelAt[1]); }
      else { const last = pts[pts.length - 1]; lx = X(last[0]) + 8; ly = Y(last[1]) + 4; }
      if (s.labelAnchor) anch = s.labelAnchor;
      if (s.labelEnd && !s.labelAt) { const last = pts[pts.length - 1]; lx = X(last[0]) + 8; ly = Y(last[1]) + 4; }
      out.push(`<text class="cl" x="${lx.toFixed(1)}" y="${(ly + (s.labelDy || 0)).toFixed(1)}" text-anchor="${anch}" fill="${s.color}" stroke="#fff" stroke-width="3.4" paint-order="stroke">${s.label}</text>`);
    }
    // dots on the series
    (s.dots || []).forEach(dt => {
      const q = pts.reduce((a, b) => Math.abs(b[0] - dt) < Math.abs(a[0] - dt) ? b : a);
      out.push(`<circle cx="${X(q[0]).toFixed(1)}" cy="${Y(q[1]).toFixed(1)}" r="4.5" fill="${s.color}" stroke="#fff" stroke-width="2"/>`);
    });
  });

  // scatter points
  (cfg.points || []).forEach(p => {
    const cx = X(p.x), cy = Y(p.y);
    out.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${p.r || 5.5}" fill="${p.color || '#0E1B2C'}" stroke="#fff" stroke-width="2.4"/>`);
    if (p.label) {
      const dx = p.dx == null ? 9 : p.dx, dy = p.dy == null ? 5 : p.dy;
      out.push(`<text class="cn" x="${(cx + dx).toFixed(1)}" y="${(cy + dy).toFixed(1)}" text-anchor="${p.anchor || 'start'}" fill="${p.color || '#0E1B2C'}" stroke="#fff" stroke-width="3.6" paint-order="stroke">${p.label}</text>`);
    }
  });

  // axes
  out.push(`<line class="ax" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}"/>`);
  out.push(`<line class="ax" x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}"/>`);
  xt.forEach(v => out.push(`<text class="ct" x="${X(v).toFixed(1)}" y="${y0 + 17}" text-anchor="middle">${tickLabel(v, xs)}</text>`));
  yt.forEach(v => out.push(`<text class="ct" x="${x0 - 9}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${tickLabel(v, ys)}</text>`));
  if (cfg.xLabel) out.push(`<text class="ca" x="${((x0 + x1) / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${cfg.xLabel}</text>`);
  if (cfg.yLabel) out.push(`<text class="ca" x="16" y="${((y0 + y1) / 2).toFixed(1)}" text-anchor="middle" transform="rotate(-90 16 ${((y0 + y1) / 2).toFixed(1)})">${cfg.yLabel}</text>`);
  if (cfg.note) out.push(`<text class="ct" x="${x1}" y="${y1 - 8}" text-anchor="end">${cfg.note}</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${out.join('')}</svg>`;
}

/* ---- factory floor: fixed factors vs variable factors ---- */
function artFactory(K, L, prod, colour, opt) {
  opt = opt || {};
  const W = 680, H = 252;
  const o = [];
  o.push(`<rect x="0" y="0" width="${W}" height="${H}" fill="#FFFFFF"/>`);
  // land
  o.push(`<rect x="10" y="10" width="${W - 20}" height="${H - 34}" rx="12" fill="#F7FBFE" stroke="${colour}" stroke-opacity=".45" stroke-width="2" stroke-dasharray="7 5"/>`);
  o.push(`<text class="ca" x="22" y="30" fill="${colour}">LAND &#183; rented workshop &#183; FIXED</text>`);
  // machines
  const mw = 62, gap = 10;
  const mStart = 26;
  const mTop = 58;
  for (let i = 0; i < K; i++) {
    const x = mStart + i * (mw + gap);
    o.push(`<rect x="${x}" y="${mTop}" width="${mw}" height="52" rx="9" fill="#EDF1F7" stroke="#A9B8CC" stroke-width="1.6"/>`);
    o.push(`<circle cx="${x + 20}" cy="${mTop + 24}" r="11" fill="none" stroke="${colour}" stroke-width="2.4"/>`);
    o.push(`<circle cx="${x + 20}" cy="${mTop + 24}" r="3.4" fill="${colour}"/>`);
    o.push(`<rect x="${x + 38}" y="${mTop + 16}" width="16" height="20" rx="3" fill="#C9D4E4"/>`);
    o.push(`<rect x="${x + 44}" y="${mTop - 8}" width="7" height="12" rx="2" fill="#A9B8CC"/>`);
    o.push(`<text class="ct" x="${x + mw / 2}" y="${mTop + 68}" text-anchor="middle">machine ${i + 1}</text>`);
  }
  o.push(`<text class="ca" x="${mStart}" y="48" fill="#6B7C96">CAPITAL &#183; fixed</text>`);
  // workers
  const wStart = 26 + K * (mw + gap) + 16;
  const avail = W - 22 - wStart;
  const perRow = Math.max(6, Math.min(13, L || 1));
  const cw = Math.min(34, avail / perRow);
  const r = Math.max(3.4, Math.min(7, cw * 0.24));
  for (let i = 0; i < L; i++) {
    const row = Math.floor(i / perRow), col = i % perRow;
    const cx = wStart + cw * (col + 0.5);
    const cy = 80 + row * 46;
    o.push(`<circle cx="${cx.toFixed(1)}" cy="${cy}" r="${r.toFixed(1)}" fill="${colour}" stroke="#fff" stroke-width="1.2"/>`);
    o.push(`<rect x="${(cx - r * 0.85).toFixed(1)}" y="${(cy + r * 0.9).toFixed(1)}" width="${(r * 1.7).toFixed(1)}" height="${(r * 2.1).toFixed(1)}" rx="${(r * 0.6).toFixed(1)}" fill="${colour}" opacity=".8"/>`);
  }
  o.push(`<text class="ca" x="${W - 22}" y="48" text-anchor="end" fill="${colour}">LABOUR &#183; variable &#183; ${L} worker${L === 1 ? '' : 's'}</text>`);
  // material in / output out
  const q = ECON.output(K, L);
  o.push(`<line x1="26" y1="${H - 44}" x2="${W - 26}" y2="${H - 44}" stroke="#DDE5F0" stroke-width="2"/>`);
  o.push(`<text class="ct" x="26" y="${H - 28}">RAW MATERIALS in: $${ECON.MAT} per unit</text>`);
  o.push(`<text class="ct" x="${W - 26}" y="${H - 28}" text-anchor="end">OUTPUT: <tspan class="cn" fill="${colour}">${fmt(q, 1)} units</tspan></text>`);
  if (opt.crowd && L > 4 * K) {
    o.push(`<text class="cl" x="${W - 26}" y="${H - 52}" text-anchor="end" fill="#C2721A" stroke="#fff" stroke-width="3.2" paint-order="stroke">crowded: too many workers per machine</text>`);
  }
  if (opt.lazy && L < 4 * K) {
    o.push(`<text class="cl" x="${W - 26}" y="${H - 52}" text-anchor="end" fill="#C2721A" stroke="#fff" stroke-width="3.2" paint-order="stroke">machines are idle: spare capacity</text>`);
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${o.join('')}</svg>`;
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.max(0, Math.min(255, Math.round(r + 255 * amt)));
  g = Math.max(0, Math.min(255, Math.round(g + 255 * amt)));
  b = Math.max(0, Math.min(255, Math.round(b + 255 * amt)));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}
function lum(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

/* ---- reusable: the perfect-competition firm diagram ---- */
function cfgPCFirm(w, o) {
  const K = o.K, P = o.P, L = o.L;
  const qMax = ECON.V * K * 0.95;
  const yMax = o.yMax || 74;
  const ser = [];
  const mk = (fn, color, label) => {
    const pts = [];
    for (let l = 1; l <= ECON.MAXL; l++) {
      const x = ECON.output(K, l), y = fn(K, l);
      if (x <= qMax && y <= yMax) pts.push([x, y]);
    }
    if (pts.length) ser.push({ pts, color, width: 2.8, label });
  };
  mk(ECON.mc, '#DA3A3F', 'MC');
  mk(ECON.ac, '#1C6FD4', 'AC');
  if (o.showAVC !== false) mk(ECON.avc, '#0E9F6E', 'AVC');
  if (o.showAFC) mk(ECON.afc, '#8B5CF6', 'AFC');

  const Q = ECON.output(K, L), AC = ECON.ac(K, L);
  const profit = ECON.profit(K, L, P);
  const shapes = [], points = [], vlines = [], hlines = [];
  hlines.push({ y: P, color: '#0E1B2C', dash: '7 5', label: `P = MR = AR = $${fmt(P, 0)}`, labelSide: 'left' });

  if (o.showProfit !== false && L > 0 && Q > 0) {
    const top = Math.max(AC, P), bot = Math.min(AC, P);
    shapes.push({ type: 'rect', x0: 0, y0: top, x1: Q, y1: bot, fill: profit >= 0 ? '#0E9F6E' : '#DA3A3F', opacity: .17, stroke: profit >= 0 ? '#0E9F6E' : '#DA3A3F', sw: 1.5, dash: '4 3' });
    vlines.push({ x: Q, color: '#93A2B8', label: `Q = ${fmt(Q, 1)}` });
    points.push({ x: Q / 2, y: (AC + P) / 2, color: profit >= 0 ? '#0E9F6E' : '#DA3A3F', r: 0, label: profit >= 0 ? 'profit box' : 'loss box', dx: -4, anchor: 'middle' });
  }
  return {
    w, h: Math.round(Math.min(500, Math.max(310, w * 0.46))),
    x: [0, qMax], y: [0, yMax],
    xLabel: 'Output Q (units per period)', yLabel: 'Cost per unit ($)',
    series: ser, shapes, points, vlines, hlines
  };
}

LABVIEW.profit = {
  ctl() {
    const L = S.lab.L, P = S.lab.P;
    return `<div class="ctl" style="margin:0">
      <div class="grid2" style="gap:.9rem">
        <div>
          <div class="clab"><span class="t">Market price &mdash; given to you, not chosen by you</span><span class="v" id="ctlP">$${fmt(P, 0)}</span></div>
          <input type="range" min="10" max="52" step="1" value="${P}" data-i="lab-p">
          <div class="ticks"><span>$10</span><span>$30</span><span>$52</span></div>
        </div>
        <div>
          <div class="clab"><span class="t">Workers hired &mdash; your decision</span><span class="v" id="ctlL">${L} workers</span></div>
          <input type="range" min="0" max="14" step="1" value="${L}" data-i="lab-l">
          <div class="ticks"><span>0</span><span>4</span><span>7</span><span>11</span><span>14</span></div>
        </div>
      </div>
    </div>`;
  },
  dyn() {
    const K = S.lab.K, L = S.lab.L, P = S.lab.P;
    const Q = ECON.output(K, L), TR = P * Q, TC = ECON.tc(K, L), profit = TR - TC;
    const AC = L ? ECON.ac(K, L) : 0, MC = L ? ECON.mc(K, L) : 0;
    const best = ECON.bestL(K, P);
    const mavc = ECON.minAVC();
    return `
    <div class="grid2">
      <div>
        <div class="tiles">
          <div class="tile hi"><div class="tl">Output</div><div class="tv">${fmt(Q, 1)}</div><div class="ts">units</div></div>
          <div class="tile"><div class="tl">Total revenue</div><div class="tv">${money(TR)}</div><div class="ts">P \u00d7 Q</div></div>
          <div class="tile"><div class="tl">Total cost</div><div class="tv">${money(TC)}</div><div class="ts">TFC + TVC</div></div>
          <div class="tile ${profit >= 0 ? 'pos' : 'neg'}"><div class="tl">Economic profit</div><div class="tv">${money(profit)}</div><div class="ts">TR \u2212 TC</div></div>
          <div class="tile ${L && MC > P ? 'warn' : ''}"><div class="tl">MC</div><div class="tv">${L ? money(MC, 2) : '\u2014'}</div><div class="ts">${L ? (MC > P ? 'above price: too much output' : 'below price: produce more') : 'not producing'}</div></div>
        </div>
        <div class="card tight" style="background:#F0FAFF;border-color:#BCE6F8">
          <div class="small" style="font-weight:800">The rule you just discovered</div>
          <div class="small">Produce up to the point where <b>MC = MR</b>. In perfect competition the price <i>is</i> marginal revenue, so the rule becomes <b>MC = P</b>. Then check one thing: does the price at least cover average variable cost? If not, shut down and lose only your fixed cost.</div>
        </div>
      </div>
      <div>
        <div class="card">
          <h3 style="margin-top:0">Mission 3 &middot; Find the rule</h3>
          ${missionRow('f_p40', 'Set the price to <b>$40</b>, then find the output that maximises profit.', 'Keep the price at 40 and move the workers slider.', S.lab.missions['f_p40'])}
          ${missionRow('f_p24', 'Set the price to <b>$24</b>. Should you keep producing?', 'Compare $24 with your minimum average variable cost.', S.lab.missions['f_p24'])}
          ${missionRow('f_p16', 'Set the price to <b>$16</b>. What is the right decision now?', 'Compare what you lose by producing with what you lose by stopping.', S.lab.missions['f_p16'])}
          <div class="btnrow"><button class="btn wide" data-a="lab-check-profit">Check my answers</button></div>
        </div>
        <div class="card tight">
          <div class="scoreline"><span>Best output at $${fmt(P, 0)}</span><b>${L === best.L ? fmt(ECON.output(K, best.L), 1) + ' units \u2713' : 'not found yet'}</b></div>
          <div class="scoreline"><span>Profit there</span><b>${money(best.profit)}</b></div>
          <div class="scoreline" style="border:none"><span>Shutdown price (minimum AVC)</span><b>${money(mavc, 2)}</b></div>
        </div>
      </div>
    </div>
    <div class="chartcard" data-view="lab-profit"></div>
    <div class="btnrow right"><button class="btn primary big" data-a="lab-finish">I understand my firm \u2192</button></div>`;
  }
};

ACTS['lab-check-prod'] = () => {
  const K = S.lab.K;
  let mpL = 1, mpMax = -Infinity, apL = 1, apMax = -Infinity;
  for (let l = 1; l <= 12; l++) {
    if (ECON.mp(K, l) > mpMax) { mpMax = ECON.mp(K, l); mpL = l; }
    if (ECON.ap(K, l) > apMax) { apMax = ECON.ap(K, l); apL = l; }
  }
  let got = 0;
  if (S.lab.L === mpL && !S.lab.missions['p_mp']) { S.lab.missions['p_mp'] = 1; got += 10; }
  if (S.lab.L === apL && !S.lab.missions['p_ap']) { S.lab.missions['p_ap'] = 1; got += 10; }
  if (got) { S.insight += got; toast(`+${got} Insight \u00b7 production function cracked`); }
  else toast('Not quite \u2014 move the slider and watch how MP and AP behave.');
  softLabUpdate(); paintTop();
};
ACTS['lab-check-cost'] = () => {
  const K = S.lab.K;
  let minAcL = 1, minAc = Infinity, minAvcL = 1, minAvc = Infinity;
  for (let l = 1; l <= 14; l++) {
    if (ECON.ac(K, l) < minAc) { minAc = ECON.ac(K, l); minAcL = l; }
    if (ECON.avc(K, l) < minAvc) { minAvc = ECON.avc(K, l); minAvcL = l; }
  }
  let got = 0;
  if (S.lab.L === minAcL && !S.lab.missions['c_minac']) { S.lab.missions['c_minac'] = 1; got += 10; }
  if (S.lab.L === minAvcL && !S.lab.missions['c_shut']) { S.lab.missions['c_shut'] = 1; got += 10; }
  if (got) { S.insight += got; toast(`+${got} Insight \u00b7 cost curves mapped`); }
  else toast('Not yet \u2014 find the lowest point of the AC curve, then of the AVC curve.');
  softLabUpdate(); paintTop();
};
ACTS['lab-check-profit'] = () => {
  let got = 0;
  const best40 = ECON.bestL(S.lab.K, 40);
  if (S.lab.P === 40 && S.lab.L === best40.L && !S.lab.missions['f_p40']) { S.lab.missions['f_p40'] = 1; got += 10; }
  if (S.lab.P === 24 && S.lab.L > 0 && !S.lab.missions['f_p24']) { S.lab.missions['f_p24'] = 1; got += 10; }
  if (S.lab.P === 16 && S.lab.L === 0 && !S.lab.missions['f_p16']) { S.lab.missions['f_p16'] = 1; got += 10; }
  if (got) { S.insight += got; toast(`+${got} Insight \u00b7 the profit rule is yours`); }
  else if (S.lab.P === 40) toast('At $40 keep adding workers until profit stops rising \u2014 MC should be near $40.');
  else if (S.lab.P === 24) toast('At $24 the price still covers average variable cost, so keep producing.');
  else if (S.lab.P === 16) toast('At $16 the price is below average variable cost \u2014 every unit adds to your loss.');
  else toast('Use the price slider: try $40, then $24, then $16.');
  softLabUpdate(); paintTop();
};
ACTS['lab-finish'] = () => {
  if (!S.lab.missions['f_p40']) {
    toast('Complete Mission 3 at $40 first \u2014 then you are ready to trade.');
    S.lab.tab = 'profit'; repaint(); return;
  }
  S.K = S.lab.K; S.L = S.lab.L;
  S.chIdx = 0; S.beat = 0;
  enterBeat();
  go('chapter');
};

/* ============================================================
   MARKET FORCES — chapter engine + Chapter 1 (Perfect Competition)
   and Chapter 2 (Monopolistic Competition)
   ============================================================ */

const BEATS = {};

/* Beats are built lazily (as functions) because their text is filled with the
   student's own product, colour and firm name — all of which are only known
   after the setup screen. Building them at load time would freeze "bakery"
   into a run where the student chose soap. */
function beatsFor(id) { const b = BEATS[id]; return typeof b === 'function' ? b() : (b || []); }
function curBeats() { return beatsFor(S.chs[S.chIdx]); }
function curBeat() { return curBeats()[S.beat]; }

function enterBeat() {
  const b = curBeat();
  S.locked = false; S.res = null; S.checkAns = null; S.pick = null;
  if (!b) return;
  if (b.setup) S.dec = Object.assign({ ad: 0, variant: 0, monoK: 3, welfare: true }, typeof b.setup === 'function' ? b.setup() : b.setup);
  if (b.onEnter) b.onEnter();
}
function advance() {
  S.beat++;
  if (S.beat >= curBeats().length) {
    S.chIdx++;
    S.beat = 0;
    if (S.chIdx >= S.chs.length) { go('debrief'); return; }
  }
  enterBeat();
  go('chapter');
}

/* ---------------- scene: chapter ---------------- */
SCENES.chapter = {
  html() {
    const ch = chapter(), beats = curBeats(), b = beats[S.beat];
    const dots = beats.map((x, i) => `<span class="stepdot ${i < S.beat ? 'done' : i === S.beat ? 'on' : ''}" style="text-transform:none;letter-spacing:0">${i < S.beat ? '\u2713' : i + 1}</span>`).join('');
    return `
    <div class="card tight" style="display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:.6rem">
        <span style="font-size:1.5rem">${ch.icon}</span>
        <div><div class="kicker">Chapter ${ch.n} of ${S.chs.length} &middot; ${ch.tag}</div><h2 style="margin:0">${ch.title}</h2></div>
      </div>
      <div class="steps" style="margin:0">${dots}</div>
    </div>
    ${renderBeat(b)}`;
  },
  mount() { mountBeat(); }
};

function renderBeat(b) {
  if (!b) return '';
  if (b.t === 'intro') return beatIntro(b);
  if (b.t === 'event') return beatEvent(b);
  if (b.t === 'decision') return beatDecision(b);
  if (b.t === 'check') return beatCheck(b);
  if (b.t === 'report') return beatReport(b);
  return '';
}
function mountBeat() {
  const b = curBeat();
  if (b && b.mount) b.mount();
  drawViews();
  bindDecisionInputs();
}
function bindDecisionInputs() {
  const m = { 'dec-l': 'dec-l', 'dec-p': 'dec-p', 'dec-k': 'dec-k', 'dec-soc': 'dec-soc' };
  // handled through the global data-i delegate
}

/* ---------------- beat renderers ---------------- */
function beatIntro(b) {

ACTS['intro-pick'] = t => { S.pick = t.dataset.v; if (curBeat().onPick) curBeat().onPick(t.dataset.v); repaint(); };

/* ---------------- report beat ---------------- */

/* ============================================================
   DECISION BEAT
   ============================================================ */
function beatDecision(b) {
  if (b.kind === 'pc') return decPC(b);
  if (b.kind === 'mc') return decMC(b);
  if (b.kind === 'oligo') return decOligo(b);
  if (b.kind === 'mono') return decMono(b);
  return '';
}

function decShell(b, ctl, out, chartViews, foot) {
  const brief = typeof b.brief === 'function' ? b.brief() : b.brief;
  return `
  <div class="card fade">

/* ---------------- Chapter 1: perfect competition decisions ---------------- */
function decPC(b) {
  const P = S.dec.P, K = S.dec.K, L = S.dec.L;
  const Q = ECON.output(K, L), TR = P * Q, TC = ECON.tc(K, L), profit = TR - TC;
  const AC = L ? ECON.ac(K, L) : 0, MC = L ? ECON.mc(K, L) : 0;
  const best = ECON.bestL(K, P);
  if (S.locked) {
    const good = profit > 0;
    return `
    <div class="card ${good ? 'event good' : 'event bad'} fade">
      <div class="kicker">Result &middot; season ${b.season || ''}</div>
      <h2>${good ? 'A profitable season' : 'A season in the red'}</h2>
      <div class="tiles">
        <div class="tile hi"><div class="tl">Output</div><div class="tv">${fmt(Q, 1)}</div><div class="ts">units</div></div>
        <div class="tile"><div class="tl">Revenue</div><div class="tv">${money(TR)}</div><div class="ts">$${fmt(P, 0)} \u00d7 ${fmt(Q, 1)}</div></div>
        <div class="tile"><div class="tl">Total cost</div><div class="tv">${money(TC)}</div><div class="ts">AC = ${money(AC, 2)}</div></div>
        <div class="tile ${good ? 'pos' : 'neg'}"><div class="tl">Economic profit</div><div class="tv">${money(profit)}</div><div class="ts">added to firm value</div></div>
      </div>
      <div class="chartcard" data-view="dec-pc-chart"></div>
      ${b.after(profit, best)}
      <div class="btnrow right"><button class="btn primary big" data-a="next">Continue \u2192</button></div>
    </div>`;
  }
  const ctl = `
    <div class="ctl" style="margin-top:0">
      <div class="clab"><span class="t">Workers you hire this period</span><span class="v">${L}</span></div>
      <input type="range" min="0" max="14" step="1" value="${L}" data-i="dec-l">
      <div class="ticks"><span>0</span><span>4</span><span>7</span><span>11</span><span>14</span></div>
    </div>`;
  const out = `
    <div class="tiles">
      <div class="tile hi"><div class="tl">Output</div><div class="tv">${fmt(Q, 1)}</div><div class="ts">${prod().unitPl} per period</div></div>
      <div class="tile"><div class="tl">Revenue</div><div class="tv">${money(TR)}</div><div class="ts">market price $${fmt(P, 0)}</div></div>
      <div class="tile"><div class="tl">Total cost</div><div class="tv">${money(TC)}</div><div class="ts">AC = ${L ? money(AC, 2) : '\u2014'}</div></div>
      <div class="tile ${profit >= 0 ? 'pos' : 'neg'}"><div class="tl">Economic profit</div><div class="tv">${money(profit)}</div><div class="ts">TR \u2212 TC</div></div>
      <div class="tile ${L && MC > P ? 'warn' : ''}"><div class="tl">MC</div><div class="tv">${L ? money(MC, 2) : '\u2014'}</div><div class="ts">${L ? (MC > P ? 'MC above price' : 'MC below price') : 'not producing'}</div></div>
    </div>`;
  const foot = `
    <div class="card tight" style="background:var(--surface2)">
      <div class="small" style="font-weight:800">Your market position</div>
      <div class="scoreline"><span>Market price</span><b>$${fmt(P, 0)}</b></div>
      <div class="scoreline"><span>Your share of the town market</span><b>about ${fmt(Q / ECON.marketQ(P) * 100, 0)}%</b></div>
      <div class="scoreline"><span>Can you influence the price?</span><b>No</b></div>
      <div class="scoreline" style="border:none"><span>Fixed cost you pay anyway</span><b>${money(ECON.tfc(K))}</b></div>
      <div class="small muted" style="margin-top:.4rem">You are one of many identical sellers. The town's price is not yours to set.</div>
    </div>
    <div class="btnrow"><button class="btn primary wide big" data-a="dec-lock">Lock in the decision</button></div>`;
  return decShell(b, ctl, out, `<div class="chartcard" data-view="dec-pc-chart"></div>`, foot);
}

/* ---------------- Chapter 2: monopolistic competition ---------------- */
const AD_LEVELS = [
  { v: 0, label: 'No advertising', spend: 0, mult: 1.0 },
  { v: 1, label: 'Local posters', spend: 140, mult: 1.40 },
  { v: 2, label: 'Full campaign', spend: 380, mult: 1.80 }
];
function mcFirm(K, P, mult, adSpend, L) {
  const qd = Math.max(0, (120 - 2.2 * P) * mult);
  const qp = ECON.output(K, L);
  const sold = Math.min(qd, qp);
  const tc = ECON.tc(K, L) + adSpend;
  const tr = P * sold;
  return { qd, qp, sold, tc, tr, profit: tr - tc, lost: Math.max(0, qd - qp) };
}
function decMC(b) {
  const K = S.dec.K, P = S.dec.P, L = S.dec.L, ad = S.dec.ad, mult = S.dec.mult || 1;
  const adLv = AD_LEVELS[ad];
  const r = mcFirm(K, P, mult * adLv.mult, adLv.spend, L);
  if (S.locked) {
    const good = r.profit > 0;
    return `
    <div class="card ${good ? 'event good' : 'event bad'} fade">
      <div class="kicker">Result</div>
      <h2>${good ? 'Your version is selling' : 'A hard season'}</h2>
      <div class="tiles">
        <div class="tile"><div class="tl">Customers wanted</div><div class="tv">${fmt(r.qd, 1)}</div><div class="ts">at $${fmt(P, 0)}</div></div>
        <div class="tile"><div class="tl">You produced</div><div class="tv">${fmt(r.qp, 1)}</div><div class="ts">${r.lost > 0.05 ? '<b style="color:var(--bad)">' + fmt(r.lost, 1) + ' customers turned away</b>' : 'demand covered'}</div></div>
        <div class="tile"><div class="tl">Revenue</div><div class="tv">${money(r.tr)}</div><div class="ts">$${fmt(P, 0)} \u00d7 ${fmt(r.sold, 1)}</div></div>
        <div class="tile"><div class="tl">Costs</div><div class="tv">${money(r.tc)}</div><div class="ts">incl. ${money(adLv.spend)} advertising</div></div>
        <div class="tile ${good ? 'pos' : 'neg'}"><div class="tl">Economic profit</div><div class="tv">${money(r.profit)}</div><div class="ts">added to firm value</div></div>
      </div>
      <div class="chartcard" data-view="dec-mc-chart"></div>
      ${b.after(r)}
      <div class="btnrow right"><button class="btn primary big" data-a="next">Continue \u2192</button></div>
    </div>`;
  }
  const ctl = `
    <div class="ctl" style="margin-top:0">
      <div class="clab"><span class="t">Your price</span><span class="v">$${fmt(P, 0)}</span></div>
      <input type="range" min="24" max="52" step="1" value="${P}" data-i="dec-p">
      <div class="ticks"><span>$24</span><span>$38</span><span>$52</span></div>
    </div>
    <div class="ctl">
      <div class="clab"><span class="t">Advertising budget</span><span class="v">${money(adLv.spend)}</span></div>
      <div class="optrow">${AD_LEVELS.map(a => `<button class="opt ${ad === a.v ? 'sel' : ''}" data-a="dec-ad" data-v="${a.v}">${a.label}<small>${a.spend ? money(a.spend) + ' \u00b7 demand \u00d7' + fmt(a.mult, 2) : 'free'}</small></button>`).join('')}</div>
    </div>
    <div class="ctl">
      <div class="clab"><span class="t">Workers \u2014 production capacity</span><span class="v">${L}</span></div>
      <input type="range" min="0" max="14" step="1" value="${L}" data-i="dec-l">
      <div class="ticks"><span>0</span><span>4</span><span>7</span><span>11</span><span>14</span></div>
      <div class="small muted" style="margin-top:.25rem">Demand at your price is <b>${fmt(r.qd, 1)} units</b>; your workers can make <b>${fmt(r.qp, 1)}</b>.</div>
    </div>`;
  const out = `
    <div class="tiles">
      <div class="tile hi"><div class="tl">Demand at your price</div><div class="tv">${fmt(r.qd, 1)}</div><div class="ts">your own demand curve</div></div>
      <div class="tile"><div class="tl">You can produce</div><div class="tv">${fmt(r.qp, 1)}</div><div class="ts">${r.lost > 0.05 ? '<b style="color:var(--bad)">' + fmt(r.lost, 1) + ' lost sales</b>' : 'all demand covered'}</div></div>
      <div class="tile"><div class="tl">Revenue</div><div class="tv">${money(r.tr)}</div><div class="ts">$${fmt(P, 0)} \u00d7 ${fmt(r.sold, 1)}</div></div>
      <div class="tile"><div class="tl">Costs</div><div class="tv">${money(r.tc)}</div><div class="ts">${L ? 'AC = ' + money(r.tc / r.qp, 2) : '\u2014'}</div></div>
      <div class="tile ${r.profit >= 0 ? 'pos' : 'neg'}"><div class="tl">Economic profit</div><div class="tv">${money(r.profit)}</div><div class="ts">TR \u2212 TC</div></div>
    </div>`;
  const foot = `
    <div class="card tight" style="background:var(--surface2)">
      <div class="small" style="font-weight:800">Your market position</div>
      <div class="scoreline"><span>Product</span><b>${esc(prod().variants[S.dec.variant] || prod().variants[0])}</b></div>
      <div class="scoreline"><span>Number of rival ${sellers()}</span><b>many</b></div>
      <div class="scoreline"><span>Can you choose your price?</span><b style="color:var(--brand-d)">Yes \u2014 within limits</b></div>
      <div class="scoreline" style="border:none"><span>Do customers see you as unique?</span><b>Similar, not identical</b></div>
      <div class="small muted" style="margin-top:.4rem">Customers have a preference for your version \u2014 but a dozen other ${sellers()} sell something close enough. Your demand curve slopes downwards, and how far you can push the price depends on how different you really are.</div>
    </div>
    <div class="btnrow"><button class="btn wide" data-a="dec-match">Match production to demand</button></div>
    <div class="btnrow"><button class="btn primary wide big" data-a="dec-lock">Lock in the decision</button></div>`;
  return decShell(b, ctl, out, `<div class="chartcard" data-view="dec-mc-chart"></div>`, foot);
}
ACTS['dec-ad'] = t => { S.dec.ad = +t.dataset.v; res(); };
ACTS['dec-match'] = () => {
  const K = S.dec.K, P = S.dec.P, mult = S.dec.mult || 1, adLv = AD_LEVELS[S.dec.ad];
  const qd = Math.max(0, (120 - 2.2 * P) * mult * adLv.mult);
  let bestL = 0, bestD = Infinity;
  for (let l = 0; l <= 14; l++) { const d = Math.abs(ECON.output(K, l) - qd); if (d < bestD) { bestD = d; bestL = l; } }
  S.dec.L = bestL; res();
};

/* ---------------- lock ---------------- */
ACTS['dec-lock'] = () => {
  const b = curBeat();
  S.locked = true;
  if (b.kind === 'pc') {
    const profit = ECON.profit(S.dec.K, S.dec.L, S.dec.P);
    S.insight += (S.dec.L === ECON.bestL(S.dec.K, S.dec.P).L) ? 10 : 0;
    logRun(chapter().id, `${b.label || 'Season'} \u2014 price $${S.dec.P}`, profit);
    addValue(profit);
  } else if (b.kind === 'mc') {
    const adLv = AD_LEVELS[S.dec.ad];
    const r = mcFirm(S.dec.K, S.dec.P, (S.dec.mult || 1) * adLv.mult, adLv.spend, S.dec.L);
    logRun(chapter().id, `${b.label || 'Season'} \u2014 price $${fmt(S.dec.P, 0)}`, r.profit);
    addValue(r.profit);
  } else if (b.kind === 'oligo') {
    lockOligo(b);
  } else if (b.kind === 'mono') {
    lockMono(b);
  }
  repaint();
  paintTop();
};
ACTS['dec-l'] = t => { S.dec.L = +t.value; res(); };
ACTS['dec-p'] = t => { S.dec.P = +t.value; res(); };
ACTS['dec-k'] = t => { S.dec.K = +t.dataset.v; res(); };
ACTS['dec-welfare'] = () => { S.dec.welfare = !S.dec.welfare; res(); };

/* ---------------- charts for decisions ---------------- */
VIEWS['dec-pc-chart'] = w => chart(cfgPCFirm(w, { K: S.dec.K, P: S.dec.P, L: S.dec.L, showProfit: true }));

function cfgMCFirm(w, o) {
  const K = o.K, mult = o.mult;
  const qMax = 62, yMax = 76;
  const dem = [], mr = [], mc = [], ac = [];
  for (let q = 0; q <= qMax; q += 1) {
    dem.push([q, 54.55 - 0.4545 * q / mult]);
    mr.push([q, 54.55 - 0.909 * q / mult]);
  }
  for (let l = 1; l <= 14; l++) {
    const q = ECON.output(K, l);
    if (q <= qMax) { mc.push([q, ECON.mc(K, l)]); ac.push([q, ECON.ac(K, l)]); }
  }
  const filter = a => a.filter(p => p[1] <= yMax && p[1] >= 0);
  const r = o.res;
  const shapes = [], points = [], hlines = [], vlines = [];
  if (r && r.sold > 0.05) {
    const acHere = r.tc / r.qp;
    shapes.push({ type: 'rect', x0: 0, y0: Math.max(acHere, o.P), x1: r.sold, y1: Math.min(acHere, o.P), fill: r.profit >= 0 ? '#0E9F6E' : '#DA3A3F', opacity: .17, stroke: r.profit >= 0 ? '#0E9F6E' : '#DA3A3F', sw: 1.5, dash: '4 3' });
    points.push({ x: r.sold, y: o.P, color: '#0E1B2C', r: 6, label: `you: ${fmt(r.sold, 1)} units at $${fmt(o.P, 0)}`, dy: -11, anchor: 'middle', dx: 0 });
    if (r.lost > 0.05) vlines.push({ x: r.qd, color: '#DA3A3F', label: `${fmt(r.lost, 1)} customers turned away` });
  }
  return {
    w, h: Math.round(Math.min(500, Math.max(310, w * 0.46))),
    x: [0, qMax], y: [0, yMax],
    xLabel: 'Your output q (units per period)', yLabel: 'Price / cost ($)',
    series: filter([
      { pts: dem, color: '#0E9F6E', width: 2.8, label: 'D = AR' },
      { pts: mr, color: '#8B5CF6', width: 2.4, label: 'MR', dash: '6 4' },
      { pts: mc, color: '#DA3A3F', width: 2.8, label: 'MC' },
      { pts: ac, color: '#1C6FD4', width: 2.8, label: 'AC' }
    ]),
    shapes, points, vlines, hlines
  };
}

function pcStreet(n, closed) {
  const cells = [];
  for (let i = 0; i < n; i++) {
    cells.push({ label: i === 1 ? (S.firmName || 'You') : streetName(i), sub: i === 1 ? 'you' : 'rival', mine: i === 1, closed: closed && closed.indexOf(i) >= 0 });
  }
  return artStreet(prod(), S.colour, cells, { heading: `${n} ${sellers()} on the same street, all selling an identical ${prod().unit}` });
}

const OLIGO_H = 44, OLIGO_L = 30;
const OLIGO_PAY = {
  HH: 530, HL: -125, LH: 615, LL: 250
};
function oligoPay(me, riv) { return OLIGO_PAY[me + riv]; }
function rivalMove() {
  const o = S.oligo, r = o.mine.length;
  if (r === 0) return 'H';
  const myLast = o.mine[r - 1];
  if (o.reported && r >= 1) return Math.random() < 0.45 ? 'L' : 'H';
  if (o.collude) return Math.random() < 0.9 ? 'H' : 'L';
  if (myLast === 'L') return Math.random() < 0.8 ? 'L' : 'H';
  const rivLast = o.rival[r - 1];
  if (rivLast === 'L') return Math.random() < 0.35 ? 'L' : 'H';
  return Math.random() < 0.9 ? 'H' : 'L';
}
function oligoMatrix(o) {
  const me = o.lastMe, riv = o.lastRiv;
  const cell = (myP, rivP, hi) => {
    const you = oligoPay(myP, rivP), them = oligoPay(rivP, myP);
    const taken = (me === myP && riv === rivP) ? 'taken' : '';
    return `<td class="${hi ? 'you ' : ''}${taken}"><b class="${you >= 0 ? '' : 'bad'}">${money(you)}</b> you<small>${RIVAL_NAME}: ${money(them)}</small></td>`;
  };
  return `<table class="mx">
    <tr><th></th><th colspan="2">${RIVAL_NAME}\u2019s price</th></tr>

function socialOpt(K) {
  let bestQ = null, bestGap = Infinity;
  for (let q = 1; q <= ECON.V * K * 0.985; q += 0.25) {
    const L = ECON.labourFor(K, q);
    if (!isFinite(L)) continue;
    const gap = Math.abs(ECON.mc(K, L) - ECON.marketP(q));
    if (gap < bestGap) { bestGap = gap; bestQ = { q, L, mc: ECON.mc(K, L), pd: ECON.marketP(q) }; }
  }
  return bestQ;
}
function monoState(K, P) {
  const Q = ECON.marketQ(P);
  const L = ECON.labourFor(K, Q);
  const feasible = Q > 0 && isFinite(L);
  if (!feasible) return { Q, L: Infinity, feasible: false, profit: -Infinity };
  const tc = ECON.tc(K, L);
  return { Q, L, tc, ac: tc / Q, mc: ECON.mc(K, L), tr: P * Q, profit: P * Q - tc, feasible: true, mr: ECON.mrFromQ(Q) };
}
function dwlArea(K, Qm, Pm, MCm) {
  const so = socialOpt(K);
  if (!so || so.q <= Qm) return { area: 0, so };
  const A = [Qm, Pm], B = [Qm, MCm], C = [so.q, so.mc];
  const area = 0.5 * Math.abs(A[0] * (B[1] - C[1]) + B[0] * (C[1] - A[1]) + C[0] * (A[1] - B[1]));
  return { area, so };
}
function cfgMonopoly(w, o) {
  const K = o.K, P = o.P;
  const m = monoState(K, P);
  const yMax = 72;
  const dem = [], mr = [], mc = [], ac = [];
  for (let q = 0; q <= 300; q += 2) { dem.push([q, ECON.marketP(q)]); mr.push([q, ECON.mrFromQ(q)]); }
  for (let l = 1; l <= 60; l++) {
    const q = ECON.output(K, l);
    if (q <= ECON.V * K * 0.99) { mc.push([q, ECON.mc(K, l)]); ac.push([q, ECON.ac(K, l)]); }
  }
  const ser = [
    { pts: dem.filter(p => p[1] >= 0), color: '#0E9F6E', width: 3, label: 'D = market demand' },
    { pts: mr.filter(p => p[1] >= 0), color: '#8B5CF6', width: 2.4, label: 'MR', dash: '6 4' },
    { pts: mc.filter(p => p[1] <= yMax), color: '#DA3A3F', width: 3, label: 'MC' },
    { pts: ac.filter(p => p[1] <= yMax), color: '#1C6FD4', width: 3, label: 'AC' }
  ];
  const shapes = [], points = [], vlines = [];
  if (m.feasible && m.Q > 0) {
    shapes.push({ type: 'rect', x0: 0, y0: Math.max(m.ac, P), x1: m.Q, y1: Math.min(m.ac, P), fill: '#0E9F6E', opacity: .18, stroke: '#0E9F6E', sw: 1.6, dash: '4 3' });
    points.push({ x: m.Q, y: P, color: '#0E1B2C', r: 6.5, label: `you: ${fmt(m.Q, 0)} units at $${fmt(P, 0)}`, dy: -12, anchor: 'middle', dx: 0 });
    vlines.push({ x: m.Q, color: '#93A2B8', label: `Q = ${fmt(m.Q, 0)}` });
    points.push({ x: m.Q / 2, y: (m.ac + P) / 2, color: '#0E9F6E', r: 0, label: 'profit', anchor: 'middle', dx: 0 });
    if (o.welfare) {
      const d = dwlArea(K, m.Q, P, m.mc);
      if (d.area > 1) {
        shapes.push({ type: 'poly', pts: [[m.Q, P], [m.Q, m.mc], [d.so.q, d.so.mc]], fill: '#DA3A3F', opacity: .26, stroke: '#DA3A3F', sw: 1.6 });
        points.push({ x: (m.Q + d.so.q) / 2, y: (m.mc + P) / 2 - 4, color: '#DA3A3F', r: 0, label: 'value destroyed', anchor: 'middle', dx: 0 });
        vlines.push({ x: d.so.q, color: '#DA3A3F', label: 'where D = MC' });
      } else {
        vlines.push({ x: d.so.q, color: '#DA3A3F', label: 'where D = MC' });
      }
    }
  }
  return {
    w, h: Math.round(Math.min(520, Math.max(320, w * 0.46))),
    x: [0, 300], y: [0, yMax],
    xLabel: 'Market output Q (units per period)', yLabel: 'Price / cost ($)',
    series: ser, shapes, points, vlines
  };
}

  return decShell(b, ctl, out, `<div class="chartcard" data-view="dec-mono-chart"></div>`, foot);
}

function lockMono(b) {
  const m = monoState(S.dec.monoK, S.dec.P);
  const profit = m.feasible ? m.profit : -ECON.tfc(S.dec.monoK);
  if (!b.stage2) {
    let best = -Infinity, bp = 0;
    for (let p = 36; p <= 56; p += 0.5) { const r = monoState(S.dec.monoK, p); if (r.feasible && r.profit > best) { best = r.profit; bp = p; } }
    if (Math.abs(S.dec.P - bp) <= 1) S.insight += 10;
  }
  logRun('mono', `${b.label || 'Monopoly pricing'} \u2014 price $${fmt(S.dec.P, 0)}`, profit);
  addValue(profit);
}

function rankOf(v) {
  const max = { short: 420, std: 2450, full: 4600 }[S.mode] || 4600;
  const r = v / max;
  if (v < 0) return { t: 'AN EXPENSIVE LESSON', c: '#8E2124', note: 'You finished with a negative firm value. Every loss in this game came from a decision you can now explain.' };
  if (r >= 0.7) return { t: 'MARKET MOGUL', c: '#0B6E9E', note: 'You found the profitable ground in every market and protected it. Outstanding.' };
  if (r >= 0.45) return { t: 'PROFIT MAKER', c: '#1C6FD4', note: 'You read each market well and made the most of the power you were given.' };
  if (r >= 0.2) return { t: 'STEADY OPERATOR', c: '#0E9F6E', note: 'You survived every market structure and earned a return. Look at the analysis below to find the profit you left behind.' };
  return { t: 'SURVIVOR', c: '#C2721A', note: 'You kept the firm alive through four very different markets. The next section shows where the money was.' };
}

function TEACHER_GUIDE() {
  return `
  <button class="btn close" data-a="closeSheet">Close \u2715</button>
  <div class="kicker">Teacher guide</div>
  <h2>MARKET FORCES \u2014 how to run it</h2>
  <div class="small muted">Economics role play &middot; market structure &middot; single player &middot; one HTML file, works offline</div>
  <div class="btnrow no-print"><button class="btn" data-a="print">\uD83D\uDDA8\uFE0F Print / save as PDF</button></div>

  <h3>1 &middot; What students do</h3>
  <div class="body">Students run one manufacturing firm through four market structures in sequence. They choose a product, a brand and a colour; run a factory to discover their own production function and cost curves; then trade in perfect competition, monopolistic competition, oligopoly and monopoly. At each step they make a decision, lock it in, and see the consequences in their profit.</div>
  <div class="body">The design target is the gap you see in most classes: students can draw the diagrams but have no instinct for what a firm owner is actually looking at when they make a choice. Here the diagrams are the interface.</div>

  <h3>2 &middot; Timing and modes</h3>
  <table class="dt">
    <thead><tr><th>Mode</th><th>Content</th><th>Class time</th></tr></thead>
    <tbody>
      <tr><td>Quick Round</td><td>Firm set-up + factory + perfect competition + debrief</td><td>20\u201325 min</td></tr>
      <tr><td>Standard</td><td>Adds monopolistic competition and oligopoly</td><td>40\u201350 min</td></tr>
      <tr><td>Full Campaign</td><td>Adds monopoly and regulation</td><td>2 lessons</td></tr>
    </tbody>
  </table>
  <div class="body"><b>Suggested sequence.</b> Students play individually on their own device \u2014 the game is deliberately single-player so that each student owns their own numbers and nobody can hide behind a group.</div>
  <ol class="clean">
    <li><b>Play (20\u201330 min).</b> No talking. Tell them to notice what they cannot control.</li>
    <li><b>Compare (10 min).</b> Put four or five students\u2019 final values on the board. Ask: you all had the same workshop and the same costs, so why are these numbers different?</li>
    <li><b>Debrief questions (20 min).</b> Work through the reflection questions by section. Insist on numbers from their own run.</li>
    <li><b>Diagram link (10 min).</b> Have each student draw the diagram for the market that gave them the most profit, and label where their firm was.</li>
  </ol>

  <h3>3 &middot; The game mechanics</h3>
  <ul class="clean">
    <li><b>Firm set-up.</b> Product (6 options), brand colour (8 options), firm name. Purely cosmetic \u2014 but do point out in perfect competition that every rival carries the student\u2019s exact icon and colour, because the product is homogeneous.</li>
    <li><b>The factory.</b> Land and capital are fixed factors; labour and raw materials are variable. Free exploration with two missions, then the cost curves, then the profit rule.</li>
    <li><b>Decision rounds.</b> Every decision is locked in before the result appears. Results are calculated live from the same cost function used in the factory, so a student can check any number by hand.</li>
    <li><b>Insight points.</b> Awarded for finding the right answer in the factory (2 \u00d7 10 on production, 2 \u00d7 10 on costs, 3 \u00d7 10 on the profit rule), for each in-game check answered correctly (10 each, one is worth 15), and for hitting the profit-maximising price in the monopoly chapter (10).</li>
    <li><b>Firm value</b> is cumulative economic profit and is the main score.</li>
  </ul>

  <h3>4 &middot; The economic model behind the game</h3>
  <table class="dt">
    <thead><tr><th>Item</th><th>Value used in the game</th></tr></thead>
    <tbody>
      <tr><td>Production function (short run)</td><td>Q = 48KL\u00b2 / (16K\u00b2 + L\u00b2) \u2014 Cobb-Douglas-like, giving an initial rise in marginal product then diminishing returns</td></tr>
      <tr><td>Land (fixed)</td><td>$200 per period</td></tr>

  <h3>6 &middot; Scoring and win conditions</h3>
  <ul class="clean">
    <li><b>Firm value</b> \u2014 cumulative economic profit across every decision. This is the main score and mirrors what a real owner would care about.</li>
    <li><b>Insight points</b> \u2014 earned in the factory and in the in-game checks. A student can score poorly and still demonstrably understand the economics; reward both.</li>
    <li><b>Rank titles</b> are scaled to the mode played, so a Quick Round cannot be compared unfairly with a Full Campaign.</li>
    <li><b>There is no single winning number.</b> The pedagogically interesting comparison is <i>between</i> students: identical technology, wildly different outcomes \u2014 because of different guesses about rivals and different readings of the market.</li>
  </ul>

  <h3>7 &middot; Reflection questions and expected answers</h3>
  <div class="body">These are the questions shown on the student debrief page. The notes below are the direction a good answer should take, not a marking scheme.</div>
  <div class="q"><div class="qn">Chapter 1</div><div class="ans">
    <b>Price taking.</b> Homogeneous product plus many sellers means each firm faces a horizontal demand curve at the market price; any price above it sells nothing. There is no price decision to make.
    <br><b>The three seasons.</b> $40 with three ${sellers()} and positive profit; entry pushed the price to $27 and profit to a loss; exit and rising demand restored the price to $34; continued entry drove it to $30, where price equals minimum AC and economic profit is zero.
    <br><b>Producing at a loss.</b> Fixed cost is payable either way. As long as P &gt; AVC, output contributes to fixed cost and reduces the loss. Shut down when P &lt; minimum AVC ($18 here).
    <br><b>Who gains.</b> Consumers gain the product at the lowest possible average cost and at a price equal to marginal cost. No one is made worse off in the allocative sense; the firms simply earn only normal profit, which is not a loss \u2014 it is the return available elsewhere.
  </div></div>
  <div class="q"><div class="qn">Chapter 2</div><div class="ans">
    <b>Source of power.</b> Product differentiation \u2014 customers do not see the products as perfect substitutes, so the firm faces a downward-sloping demand curve and can choose price. The power is limited because close substitutes exist and entry is free.
    <br><b>The disappearing profit.</b> Imitation and entry shifted the firm\u2019s demand curve leftward. Cost curves unchanged, demand fell, so the profit-maximising price\u2013output combination moved to a point where P \u2248 AC.
    <br><b>Advertising.</b> In this model $140 of advertising costs $140 and lifts the price at which the same quantity can be sold, but only modestly: at launch it is roughly profit-neutral, after imitation it buys back about $10. Advertising pays only when the increase in demand (and the resulting margin) exceeds the cost of the campaign. Note the familiar "if it worked for everyone, it stops working for anyone" effect.
    <br><b>Versus perfect competition.</b> Price is above marginal cost and output is below the AC-minimising level (excess capacity), so the market is neither allocatively nor productively efficient. What consumers get in return is variety and choice.
    <br><b>With a trademark.</b> Copying would be illegal, so entry would be blocked and the demand curve would not shift left. The firm would move towards monopoly \u2014 higher sustained profit, and the market toward the inefficiency of Chapter 4.
  </div></div>
  <div class="q"><div class="qn">Chapter 3</div><div class="ans">
    <b>Best responses and Nash.</b> Whatever the rival does, cutting is the better move: if they hold, cutting earns $615 instead of $530; if they cut, cutting earns $250 instead of \u2212$125. So both cut, and the Nash equilibrium is the bottom-right cell \u2014 $250 each, worse for both than the $530 each available from mutual restraint.
    <br><b>The apparent contradiction.</b> This is the prisoner\u2019s dilemma: the joint-best outcome is not an equilibrium because each player has a unilateral incentive to deviate. Co-operation requires trust or enforcement, and neither is available.
    <br><b>Illegal versus wrong.</b> Price fixing is illegal under competition law because it restricts output and raises prices, harming consumers, and because the agreement is unstable it also wastes resources on policing it. Whether it is <i>wrong</i> is a normative question students should be able to argue both ways \u2014 the economics shows the damage, not the morality.
    <br><b>Enforceable cartel.</b> Output would fall and price rise towards the monopoly level; consumers and firms outside the agreement would lose; the two firms would split the resulting monopoly profit. This is why cartels are treated as a form of market failure.
    <br><b>Non-price competition.</b> It is legal, it can shift demand rather than merely redistribute it, and it is harder for a regulator to attack. It is also often self-cancelling, as the monopolistic competition chapter showed.
  </div></div>
  <div class="q"><div class="qn">Chapter 4</div><div class="ans">
    <b>Price maker.</b> With no rivals and barriers to entry, the firm is the market: the market demand curve is its own, so quantity sold depends on the price it sets. A competitive firm faces a horizontal demand curve and quantity is its only choice.
    <br><b>MR &lt; P.</b> To sell one more unit the monopolist must lower its price, and the lower price applies to all the units it was already selling. The extra revenue is therefore the new price minus the revenue lost on the earlier units \u2014 always less than price.
    <br><b>Two losses.</b> The profit rectangle is a <i>transfer</i>: consumers pay more, the firm receives it. The deadweight loss triangle is a <i>destruction</i>: units that would have been worth more to buyers than they cost to produce are never made, and nobody receives that value.
    <br><b>Price cap.</b> The cap lowers price towards marginal cost, which removes the reason to restrict output. The firm keeps its licence and still earns a normal return, but the profit from restricting output disappears.
    <br><b>Both sides.</b> Against: higher prices, lower output, deadweight loss, weaker incentives to control costs ("X-inefficiency"). For: patent-protected monopoly profits can fund research that competitive firms cannot finance; large-scale production can lower average cost; and in natural monopoly a single producer is cheaper than duplicated networks. The exam answer is the balance, not a verdict.
  </div></div>
  <div class="q"><div class="qn">Synthesis</div><div class="ans">
    The single factor is <b>barriers to entry</b> \u2014 which determine how much of the profit is competed away. Where entry is free, profit is competed to normal levels; where entry is blocked, the firm keeps it. The identical workshop across all four chapters is the proof that the source of profit is the market structure, not the firm.
  </div></div>

  <h3>9 &middot; Common misconceptions and how the game corrects them</h3>
  <ul class="clean">
    <li><b>\u201cZero economic profit means the business is failing.\u201d</b> The long-run perfect competition chapter makes this concrete: the firm still covers every cost including the owner\u2019s labour and capital. Normal profit is a real return, not a loss.</li>
    <li><b>\u201cA monopolist can charge whatever it likes.\u201d</b> The price slider is bounded by demand: raise the price and quantity collapses. The game forces students to trade the two off.</li>
    <li><b>\u201cFirms only shut down when they make a loss.\u201d</b> Season two is designed to break this. Students lose less by producing than by stopping, and the reason is the fixed/variable cost split they met in the factory.</li>
    <li><b>\u201cIf you earned profit, you must have been skilful.\u201d</b> The comparison of Chapter 1 and Chapter 4 with identical technology is the corrective.</li>
    <li><b>\u201cMarginal revenue is just price.\u201d</b> Students meet MR = P in Chapter 1 and then watch it fall below P in Chapters 2 and 4.</li>
    <li><b>\u201cAdvertising always pays.\u201d</b> In the model it is close to self-cancelling. Some students find this genuinely surprising, and it is worth a short discussion of real advertising in monopolistically competitive markets.</li>
  </ul>
